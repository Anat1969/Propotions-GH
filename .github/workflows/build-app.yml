# בונה עותק יחסי של האפליקציה ל-app/, כדי שאפשר יהיה לראות את המיזוג האחרון בלי Vercel:
# https://raw.githack.com/Anat1969/Propotions-GH/main/app/index.html
name: build-app
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build:github
      - name: commit app/ if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app
          git diff --cached --quiet && exit 0
          git commit -m "build: app/ for raw.githack"
          git push
